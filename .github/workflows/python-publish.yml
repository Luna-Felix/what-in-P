# 这个文件放置在 .github/workflows/daily-publish.yml
name: Daily WeChat Publisher

on:
  schedule:
    # 每天 UTC 时间 13:00 运行，即北京时间晚上 21:00
    - cron: '0 13 * * *'
  # 添加手动触发功能，方便测试
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run publisher
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
        run: |
          python publish.py
